<!doctype html>
<html lang="en" data-concept="05">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Annabel's Pet Care photo wall: Concept 05, Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--rose:#B87383;--rose-d:#9E5B6B;--rose-l:#F7EFF1;--sage:#5B7568;--ink:#2B2527;--muted:#665E61;--cream:#FAF7F5;--line:#EBE1DC}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--ink);font:400 15px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* The concept is a homepage SECTION, so it's shown inside a slice of page. */
  .page-top{max-width:1180px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .brand{font:600 24px/1 'Cormorant Garamond',Georgia,serif}
  .nav{display:flex;gap:22px;font-size:14px;color:var(--muted)}
  .nav b{color:var(--ink);font-weight:600}
  .sec{padding:44px 0 26px;text-align:center}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-d);margin:0 0 10px;font-weight:600}
  h1{font:500 clamp(36px,4.4vw,58px)/1.05 'Cormorant Garamond',Georgia,serif;margin:0 0 12px}
  h1 em{color:var(--rose-d)}
  .sec p{color:var(--muted);margin:0 auto;max-width:56ch}
  .draft{font-size:12px;color:#9a8f92;margin-top:6px!important}
  .mosaic{position:relative;height:min(62vh,560px);overflow:hidden;touch-action:pan-y;cursor:grab;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
  .mosaic.drag{cursor:grabbing}
  .track{position:absolute;left:0;top:0;height:100%;display:flex;gap:12px;will-change:transform}
  .col{display:flex;flex-direction:column;gap:12px;flex:none}
  .col.big{width:300px}.col.mid{width:220px}.col.sm{width:170px}
  .t{all:unset;display:block;border-radius:12px;overflow:hidden;background:var(--rose-l);cursor:zoom-in;flex:none;transition:transform .3s ease, box-shadow .3s ease}
  .t img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
  .t:hover,.t:focus-visible{transform:scale(1.03);box-shadow:0 16px 30px -16px rgba(43,37,39,.5)}
  .t:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
  .ctrl{display:flex;justify-content:center;gap:10px;padding:18px 0 70px;align-items:center;color:var(--muted);font-size:13px}
  .ctrl button{all:unset;cursor:pointer;border:1px solid var(--line);background:#FFFDF9;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--ink)}
  .ctrl button:hover,.ctrl button:focus-visible{border-color:var(--rose);color:var(--rose-d)}
  .state{display:inline-flex;align-items:center;gap:6px}
  .state i{width:8px;height:8px;border-radius:50%;background:var(--sage)}
  .paused .state i{background:var(--rose)}
  @media (max-width:700px){.nav{display:none}.col.big{width:220px}.col.mid{width:160px}.col.sm{width:130px}.mosaic{height:62vh}.sec{padding-top:36px}}
</style>
</head>
<body>
<div class="page-top"><span class="brand">Annabel's Pet Care</span><span class="nav"><span>Services</span><span>About</span><b>Clients</b><span>Reviews</span><span>Contact</span></span></div>

<section class="sec" aria-labelledby="h">
  <p class="eyebrow">Real clients</p>
  <h1 id="h">A few of the <em>regulars</em>.</h1>
  <p>Every photo is from a real walk or house sit. Hover to pause, tap one to look closer.</p>
  <p class="draft">[DRAFT copy] Photos are PLACEHOLDERS.</p>
</section>

<div class="mosaic" id="mosaic" role="region" aria-label="Slowly moving mosaic of pet photos. Hover or focus to pause. Drag or swipe to move it yourself.">
  <div class="track" id="track"></div>
</div>
<div class="ctrl" id="ctrl">
  <span class="state"><i></i><span id="st">Drifting</span></span>
  <button type="button" id="pp">Pause</button>
  <span id="cnt"></span>
</div>

<script src="../../shared/tiles.js"></script>
<script src="../../shared/lightbox.js"></script>
<script>
(function(){
  var mosaic=document.getElementById("mosaic"), track=document.getElementById("track"), photos=PW.photos;
  var H=mosaic.clientHeight, GAP=12;
  // Column recipes: varied rhythm (1 tall, 2 stacked, 3 small) so it reads as a mosaic, not a strip.
  var recipes=[["big",[1]],["mid",[.55,.45]],["sm",[.34,.33,.33]],["mid",[.4,.6]],["big",[.58,.42]],["sm",[.5,.5]],["mid",[1]],["sm",[.3,.4,.3]]];
  var cols=[], k=0, ri=0, totalW=0;
  while(k<photos.length){
    var r=recipes[ri%recipes.length]; ri++;
    var col=document.createElement("div"); col.className="col "+r[0];
    r[1].forEach(function(f){ if(k>=photos.length)return; var p=photos[k], i=k++;
      var b=document.createElement("button"); b.type="button"; b.className="t"; b.dataset.i=i;
      b.style.height="calc("+(f*100)+"% - "+(GAP*(r[1].length-1)/r[1].length)+"px)";
      b.setAttribute("aria-label","Open placeholder photo: "+PW.caption(p));
      b.innerHTML='<img alt="" draggable="false">'; col.appendChild(b); });
    track.appendChild(col); cols.push(col);
  }
  // Duplicate the first screenful at the end so the loop is seamless.
  var widthOf=function(){return track.scrollWidth;};
  var loopW=widthOf()+GAP, clones=0, acc=0;
  for(var c=0;c<cols.length&&acc<innerWidth+400;c++){var cl=cols[c].cloneNode(true);cl.setAttribute("aria-hidden","true");cl.querySelectorAll("button").forEach(function(b){b.tabIndex=-1});track.appendChild(cl);acc+=cols[c].offsetWidth+GAP;clones++;}
  document.getElementById("cnt").textContent=photos.length+" photos";

  // Load images just ahead of the viewport (real build: loading="lazy" on <img> does this).
  var queue=[], queued=new WeakSet();
  function pump(){var t=performance.now();while(queue.length&&performance.now()-t<10){var b=queue.shift();b.firstChild.src=PW.thumbL(photos[+b.dataset.i]);}if(queue.length)PW.frame(pump);}
  function want(){var lim=-pos+innerWidth+600; track.querySelectorAll(".t").forEach(function(b){ if(queued.has(b))return; var l=b.parentNode.offsetLeft; if((l>=-pos-300&&l<lim)||(l<lim-loopW)){queued.add(b);queue.push(b);} }); if(queue.length)PW.frame(pump);}

  var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pos=0, speed=reduced?0:0.35, hover=false, manual=false, last=performance.now();
  function wrap(){ while(pos<=-loopW)pos+=loopW; while(pos>0)pos-=loopW; }
  function tick(now){ var dt=Math.min(50,now-last); last=now;
    if(!hover&&!manual&&!down&&!document.querySelector(".pwlb.on")) pos-=speed*dt/16;
    wrap(); track.style.transform="translate3d("+pos+"px,0,0)"; if(Math.round(-pos)%120<2)want(); PW.frame(tick); }
  mosaic.addEventListener("pointerenter",function(e){if(e.pointerType==="mouse")hover=true;});
  mosaic.addEventListener("pointerleave",function(){hover=false;});
  mosaic.addEventListener("focusin",function(){hover=true;});
  mosaic.addEventListener("focusout",function(){hover=false;});

  // drag / swipe horizontally; vertical swipes still scroll the page (touch-action:pan-y)
  var down=false,moved=0,lx=0;
  mosaic.addEventListener("pointerdown",function(e){down=true;moved=0;lx=e.clientX;mosaic.setPointerCapture(e.pointerId);mosaic.classList.add("drag");});
  mosaic.addEventListener("pointermove",function(e){if(!down)return;var dx=e.clientX-lx;pos+=dx;moved+=Math.abs(dx);lx=e.clientX;want();});
  mosaic.addEventListener("pointerup",function(e){down=false;mosaic.classList.remove("drag");if(moved<6){var b=document.elementFromPoint(e.clientX,e.clientY);b=b&&b.closest(".t");if(b)PW.lightbox(photos,+b.dataset.i);}});
  mosaic.addEventListener("pointercancel",function(){down=false;mosaic.classList.remove("drag");});
  mosaic.addEventListener("click",function(e){if(e.detail===0){var b=e.target.closest(".t");if(b)PW.lightbox(photos,+b.dataset.i);}});

  var pp=document.getElementById("pp"), ctrl=document.getElementById("ctrl"), st=document.getElementById("st");
  function setManual(m){manual=m;pp.textContent=m?"Play":"Pause";st.textContent=m?"Paused":"Drifting";ctrl.classList.toggle("paused",m);}
  pp.onclick=function(){setManual(!manual)};
  if(reduced){setManual(true);}
  want(); PW.frame(tick);
})();
</script>
<script src="../../shared/board.js"></script>
</body>
</html>
