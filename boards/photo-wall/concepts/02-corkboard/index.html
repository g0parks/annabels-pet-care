<!doctype html>
<html lang="en" data-concept="02">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Annabel's Pet Care photo wall: Concept 02, Corkboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--rose:#B87383;--rose-d:#9E5B6B;--rose-l:#F7EFF1;--sage:#5B7568;--ink:#2B2527;--muted:#665E61;--cream:#FAF7F5;--line:#EBE1DC;--cork:#D9BFA0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:400 15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:#CDB08F}
  #stage{position:fixed;inset:0;cursor:grab;touch-action:none;overflow:hidden;outline:none}
  #stage.drag{cursor:grabbing}
  /* cork: layered dots, no image files */
  #board{position:absolute;left:0;top:0;will-change:transform;transform-origin:0 0;
    background-color:var(--cork);
    background-image:
      radial-gradient(rgba(120,80,45,.22) 1px, transparent 1.6px),
      radial-gradient(rgba(255,240,220,.28) 1px, transparent 1.8px),
      radial-gradient(rgba(140,95,55,.16) 2px, transparent 2.8px);
    background-size:7px 7px, 11px 13px, 23px 19px;
    background-position:0 0, 3px 5px, 9px 2px;
    box-shadow:inset 0 0 0 18px #B98F68, inset 0 0 0 22px #A57B55, inset 0 0 60px 30px rgba(90,55,30,.25)}
  .pol{position:absolute;width:var(--pw);background:#FFFDF9;padding:10px 10px 0;border-radius:2px;
    box-shadow:0 1px 1px rgba(60,35,20,.18),0 8px 16px -6px rgba(60,35,20,.35);transform:rotate(var(--r));transition:transform .25s ease, box-shadow .25s ease;cursor:pointer}
  .pol:hover,.pol:focus-visible{transform:rotate(0deg) scale(1.06) translateY(-4px);box-shadow:0 2px 2px rgba(60,35,20,.15),0 22px 34px -10px rgba(60,35,20,.45);z-index:3;outline:none}
  .pol:focus-visible{box-shadow:0 0 0 3px var(--rose),0 22px 34px -10px rgba(60,35,20,.45)}
  .pol .ph{display:block;width:100%;aspect-ratio:1/1;background:var(--rose-l);overflow:hidden}
  .pol img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
  .pol .cap{font:500 italic 17px/1.15 'Cormorant Garamond',Georgia,serif;color:#4a4044;padding:9px 2px 12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pin{position:absolute;left:50%;top:-7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E7B7C2,#B87383 55%,#7E4554);box-shadow:0 3px 3px rgba(0,0,0,.25)}
  .tape{position:absolute;left:50%;top:-10px;width:70px;height:20px;margin-left:-35px;background:rgba(247,239,241,.78);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .tape.sage{background:rgba(214,226,218,.8)}
  .note{position:absolute;width:300px;background:#FAF7F5;padding:26px 26px 22px;box-shadow:0 10px 24px -10px rgba(60,35,20,.5);transform:rotate(-1.5deg)}
  .note .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-d);margin:0 0 8px;font-weight:600}
  .note h1{font:500 34px/1.05 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
  .note p{margin:0 0 8px;color:var(--muted);font-size:14px}
  .note .draft{font-size:11px;color:#9a8f92}
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;z-index:6;pointer-events:none}
  .brand{pointer-events:auto;font:600 22px/1 'Cormorant Garamond',Georgia,serif;color:var(--ink);background:rgba(250,247,245,.94);padding:9px 14px;border-radius:999px;box-shadow:0 4px 14px -6px rgba(60,35,20,.4)}
  .tools{pointer-events:auto;display:flex;gap:6px}
  .tools button{all:unset;cursor:pointer;background:rgba(250,247,245,.94);border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;box-shadow:0 4px 14px -6px rgba(60,35,20,.4)}
  .tools button:hover,.tools button:focus-visible{color:var(--rose-d)}
  @media (max-width:700px){.brand{font-size:19px}}
</style>
</head>
<body>
<div id="stage" tabindex="0" aria-label="Corkboard of pet photos. Drag, scroll or use arrow keys to move. Use plus and minus to zoom.">
  <div id="board"></div>
</div>
<header class="top">
  <span class="brand">Annabel's Pet Care</span>
  <div class="tools">
    <button type="button" id="zo" aria-label="Zoom out">&minus;</button>
    <button type="button" id="zi" aria-label="Zoom in">+</button>
    <button type="button" id="home">Center</button>
  </div>
</header>

<script src="../../shared/tiles.js"></script>
<script src="../../shared/lightbox.js"></script>
<script>
(function(){
  var stage=document.getElementById("stage"), board=document.getElementById("board");
  var photos=PW.photos, N=photos.length;
  var small=matchMedia("(max-width:700px)").matches;
  var PW_=small?150:190; document.documentElement.style.setProperty("--pw",PW_+"px");
  var CELL=PW_*1.12, COLS=Math.ceil(Math.sqrt(N*1.5)), ROWS=Math.ceil(N/COLS)+1;
  var BW=COLS*CELL+160, BH=ROWS*CELL*1.18+160;
  board.style.width=BW+"px"; board.style.height=BH+"px";

  // Seeded jitter so the pile looks hand-pinned but is stable between visits.
  function rnd(i,k){var s=Math.sin(i*12.9898+k*78.233)*43758.5453;return s-Math.floor(s);}
  var items=photos.map(function(p,i){
    var c=i%COLS, r=Math.floor(i/COLS);
    return {p:p,i:i,x:80+c*CELL+(rnd(i,1)-.5)*CELL*.55,y:80+r*CELL*1.18+(rnd(i,2)-.5)*CELL*.5,rot:((rnd(i,3)-.5)*14).toFixed(1),fx:rnd(i,4)<.6?"pin":(rnd(i,5)<.5?"tape":"tape sage"),el:null};
  });
  // Welcome note pinned in the middle of the board; the photos around it slide aside.
  var NX=BW/2-150, NY=BH/2-120;
  items.forEach(function(it){ if(it.x>NX-PW_*1.05&&it.x<NX+320&&it.y>NY-PW_*1.2&&it.y<NY+260){ it.y+= (it.y<NY+60?-1:1)*PW_*0.9; }});
  var note=document.createElement("div"); note.className="note"; note.style.left=NX+"px"; note.style.top=NY+"px";
  note.innerHTML='<span class="pin"></span><p class="eyebrow">The board</p><h1>All of these are real clients.</h1><p>Walk check-ins and house-sit updates, pinned up as they come in.</p><p class="draft">[DRAFT copy] Photos are PLACEHOLDERS.</p>';
  board.appendChild(note);

  var x=0,y=0,z=small?.8:1;
  function center(){x=innerWidth/2-(BW/2)*z; y=innerHeight/2-(BH/2)*z;}
  center();

  var queue=[];
  function pump(){var t=performance.now(); while(queue.length&&performance.now()-t<10){var it=queue.shift(); if(it.el&&!it.el.querySelector("img").src) it.el.querySelector("img").src=PW.thumb(it.p);} if(queue.length)PW.frame(pump);}
  function mk(it){
    var d=document.createElement("button"); d.type="button"; d.className="pol";
    d.style.left=it.x+"px"; d.style.top=it.y+"px"; d.style.setProperty("--r",it.rot+"deg"); d.dataset.i=it.i;
    d.setAttribute("aria-label","Open placeholder photo: "+PW.caption(it.p));
    d.innerHTML='<span class="'+it.fx+'"></span><span class="ph"><img alt="" draggable="false"></span><span class="cap" style="display:block">'+it.p.service+' &middot; '+it.p.area+'</span>';
    return d;
  }
  function render(){
    board.style.transform="translate3d("+x+"px,"+y+"px,0) scale("+z+")";
    var pad=PW_*1.5, vx0=(-x)/z-pad, vy0=(-y)/z-pad, vx1=(innerWidth-x)/z+pad, vy1=(innerHeight-y)/z+pad, q=false;
    for(var i=0;i<items.length;i++){var it=items[i], vis=it.x>vx0&&it.x<vx1&&it.y>vy0&&it.y<vy1;
      if(vis&&!it.el){it.el=mk(it); board.appendChild(it.el); queue.push(it); q=true;}
      else if(!vis&&it.el){it.el.remove(); it.el=null;}}
    if(q&&queue.length)PW.frame(pump);
  }
  var down=false,moved=0,lx,ly,vx=0,vy=0,lt,raf;
  stage.addEventListener("pointerdown",function(e){down=true;moved=0;lx=e.clientX;ly=e.clientY;lt=performance.now();vx=vy=0;cancelAnimationFrame(raf);stage.setPointerCapture(e.pointerId);stage.classList.add("drag");});
  stage.addEventListener("pointermove",function(e){if(!down)return;var dx=e.clientX-lx,dy=e.clientY-ly,dt=Math.max(1,performance.now()-lt);x+=dx;y+=dy;moved+=Math.abs(dx)+Math.abs(dy);vx=dx/dt*16;vy=dy/dt*16;lx=e.clientX;ly=e.clientY;lt=performance.now();clamp();render();});
  stage.addEventListener("pointerup",function(e){down=false;stage.classList.remove("drag");
    if(moved<6){var b=document.elementFromPoint(e.clientX,e.clientY);b=b&&b.closest(".pol");if(b)PW.lightbox(photos,+b.dataset.i);return;}
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches)glide();});
  function glide(){vx*=.93;vy*=.93;x+=vx;y+=vy;clamp();render();if(Math.abs(vx)+Math.abs(vy)>.3)raf=requestAnimationFrame(glide);}
  function clamp(){var m=120; x=Math.min(m,Math.max(innerWidth-BW*z-m,x)); y=Math.min(m,Math.max(innerHeight-BH*z-m,y));}
  function zoom(f,cx,cy){cx=cx==null?innerWidth/2:cx;cy=cy==null?innerHeight/2:cy;var nz=Math.min(1.6,Math.max(.35,z*f));x=cx-(cx-x)*nz/z;y=cy-(cy-y)*nz/z;z=nz;clamp();render();}
  stage.addEventListener("wheel",function(e){e.preventDefault(); if(e.ctrlKey){zoom(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY);} else {x-=e.deltaX;y-=e.deltaY;clamp();render();}},{passive:false});
  stage.addEventListener("keydown",function(e){var s=160;if(e.key==="ArrowLeft")x+=s;else if(e.key==="ArrowRight")x-=s;else if(e.key==="ArrowUp")y+=s;else if(e.key==="ArrowDown")y-=s;else if(e.key==="+"||e.key==="=")return zoom(1.2);else if(e.key==="-")return zoom(1/1.2);else return;e.preventDefault();clamp();render();});
  board.addEventListener("click",function(e){if(e.detail===0){var b=e.target.closest(".pol");if(b)PW.lightbox(photos,+b.dataset.i);}});
  // two-finger pinch on phones
  var pts={},pd=0;
  stage.addEventListener("pointerdown",function(e){pts[e.pointerId]=e;});
  stage.addEventListener("pointermove",function(e){if(!pts[e.pointerId])return;pts[e.pointerId]=e;var k=Object.keys(pts);if(k.length===2){down=false;var a=pts[k[0]],b=pts[k[1]],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)zoom(d/pd,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);pd=d;}});
  ["pointerup","pointercancel"].forEach(function(t){stage.addEventListener(t,function(e){delete pts[e.pointerId];pd=0;});});
  document.getElementById("zi").onclick=function(){zoom(1.2)};
  document.getElementById("zo").onclick=function(){zoom(1/1.2)};
  document.getElementById("home").onclick=function(){z=small?.8:1;center();render();};
  addEventListener("resize",function(){clamp();render();});
  render();
})();
</script>
<script src="../../shared/board.js"></script>
</body>
</html>
